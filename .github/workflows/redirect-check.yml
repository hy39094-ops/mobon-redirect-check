name: redirect-check

on:
  # 예약 실행: 11월 18일 16:00 ~ 19:00 (한국 시간), 8분 간격
  # GitHub 예약은 UTC 기준이라 한국 시간 -9시간으로 적는다 (KST 16시 = UTC 7시)
  # 16:00 16:08 ... 16:56 / 17:04 ... 17:52 / 18:00 ... 18:56 (총 23회)
  # GitHub 사정으로 몇 분씩 늦게 시작되거나, 서버가 붐비면 일부 회차가 건너뛰어질 수 있음
  # 날짜(18일 11월)만 지정돼 있어 내년 같은 날에도 돈다 → 끝나면 이 schedule 블록을 지울 것
  schedule:
    - cron: "0,8,16,24,32,40,48,56 7 18 11 *"   # KST 16시대
    - cron: "4,12,20,28,36,44,52 8 18 11 *"     # KST 17시대
    - cron: "0,8,16,24,32,40,48,56 9 18 11 *"   # KST 18시대
  # 수동 실행: Actions 탭 > redirect-check > Run workflow
  workflow_dispatch:
    inputs:
      base_url:
        description: "검사할 사이트 주소 (테스트: https://web-master.mobon.net / 전환 후: https://www.mobon.net)"
        required: true
        default: "https://web-master.mobon.net"
      priority:
        description: "이 등급 이하만 실행 (1 / 2 / 3)"
        required: true
        default: "3"

# 앞 실행이 안 끝났으면 겹쳐 돌리지 않는다
concurrency:
  group: redirect-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # 자동 실행 때는 저장소 변수(Settings > Secrets and variables > Actions > Variables)의 값을 쓴다
      BASE_URL: ${{ inputs.base_url || vars.BASE_URL || 'https://web-master.mobon.net' }}
      PRIORITY: ${{ inputs.priority || vars.PRIORITY || '3' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # FAIL 이 있으면 이 단계가 실패하고 실행 결과가 빨간 X 가 된다. 결과표는 Summary 에 나온다
      - run: python check_redirects.py --base-url "$BASE_URL" --priority "$PRIORITY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redirect-result
          path: |
            report.md
            result.csv
          retention-days: 3
